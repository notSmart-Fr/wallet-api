spring:
  application:
    name: wallet-api

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/wallet_db
    username: wallet_user
    password: wallet_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # Supabase project JWT issuer and JWKS endpoint
          issuer-uri: https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1
          jwk-set-uri: https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: health, info